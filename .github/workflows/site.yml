name: Documentation site

on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked default-branch artifact to GitHub Pages
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: site-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.publish || false }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Record runtime
        run: bun --version
      - name: Install locked site dependencies
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: site
        run: bun run typecheck
      - name: Build canonical public content
        working-directory: site
        env:
          SITE_SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun run build
      - name: Check output and isolated allowlist rebuild
        working-directory: site
        env:
          SITE_SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun run check
      - name: Package explicitly requested Pages artifact
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: site-pages-publication
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy checked static artifact
        id: deployment
        uses: actions/deploy-pages@v4
