name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Record Bun version
        run: bun --version
      - name: Install locked Bun dependencies
        run: bun install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Verify Ruby YAML support
        run: ruby -e 'require "yaml"'
      - name: Install Skill test dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Prepare isolated Linux native evidence
        if: runner.os == 'Linux'
        run: |
          sudo install -m 0755 "$(command -v bun)" /usr/bin/bun
          echo "AGENT_VM_ISOLATED_TRANSPORT_EVIDENCE=1" >> "$GITHUB_ENV"
      - name: Typecheck
        run: bun run typecheck
      - name: Run repository checks
        run: bun run check
      - name: Run repository tests
        run: bun run test:repo
      - name: Run Skill tests
        run: bun run test:skills
